# Depot CI Migration
# Source: .github/workflows/govulncheck.yml
#
# Changes made:
# - Rewrote .github/ path references to .depot/
# - Changed GitHub runs-on labels to their Depot equivalents

---
###
# This action is synced from https://github.com/prometheus/prometheus
###
name: govulncheck
# GitLab runners are the default; Depot execution is opt-in.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    name: Run govulncheck
    steps:
      - name: Install snmp_exporter/generator dependencies
        id: snmp-deps
        run: sudo apt-get update && sudo apt-get -y install libsnmp-dev
        if: github.repository == 'prometheus/snmp_exporter'
      - id: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # master
        env:
          GOOS: ${{ contains(github.repository, 'windows_exporter') && 'windows' || '' }}
