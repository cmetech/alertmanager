---

swagger: '2.0'

info:
  version: 0.0.1
  title: Alertmanager API
  description: API of the Prometheus Alertmanager (https://github.com/prometheus/alertmanager)
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

consumes:
  - "application/json"
produces:
  - "application/json"

basePath: "/api/v2/"

paths:
  /status:
    get:
      tags:
        - general
      operationId: getStatus
      description: Get current status of an Alertmanager instance and its cluster
      responses:
        '200':
          description: Get status response
          schema:
            $ref: '#/definitions/alertmanagerStatus'
  /receivers:
    get:
      tags:
        - receiver
      operationId: getReceivers
      description: Get list of all receivers (name of notification integrations)
      parameters:
        - $ref: '#/parameters/receiverMatchers'
      responses:
        '200':
          description: Get receivers response
          schema:
            type: array
            items:
              $ref: '#/definitions/receiver'
        '400':
          $ref: '#/responses/BadRequest'
  /silences:
    get:
      tags:
        - silence
      operationId: getSilences
      description: Get a list of silences
      responses:
        '200':
          description: Get silences response
          schema:
            $ref: '#/definitions/gettableSilences'
        '400':
          $ref: '#/responses/BadRequest'
        '500':
          $ref: '#/responses/InternalServerError'
      parameters:
        - name: filter
          in: query
          description: A matcher expression to filter silences. For example `alertname="MyAlert"`. It can be repeated to apply multiple matchers.
          required: false
          type: array
          collectionFormat: multi
          items:
            type: string
        - in: query
          name: active
          type: boolean
          description: Include active silences in results. If false, excludes active silences.
          default: true
        - in: query
          name: expired
          type: boolean
          description: Include expired silences in results. If false, excludes expired silences.
          default: true
        - in: query
          name: pending
          type: boolean
          description: Include pending silences in results. If false, excludes pending silences.
          default: true
    post:
      tags:
        - silence
      operationId: postSilences
      description: Post a new silence or update an existing one
      parameters:
        - in: body
          name: silence
          description: The silence to create
          required: true
          schema:
            $ref: '#/definitions/postableSilence'
      responses:
        '200':
          description: Create / update silence response
          schema:
            type: object
            properties:
              silenceID:
                type: string
        '400':
          $ref: '#/responses/BadRequest'
        '404':
          description: A silence with the specified ID was not found
          schema:
            type: string
  /silence/{silenceID}:
    parameters:
      - in: path
        name: silenceID
        type: string
        format: uuid
        required: true
        description: ID of the silence to get
    get:
      tags:
        - silence
      operationId: getSilence
      description: Get a silence by its ID
      responses:
        '200':
          description: Get silence response
          schema:
            $ref: '#/definitions/gettableSilence'
        '404':
          description: A silence with the specified ID was not found
        '500':
          $ref: '#/responses/InternalServerError'
    delete:
      tags:
        - silence
      operationId: deleteSilence
      description: Delete a silence by its ID
      parameters:
        - in: path
          name: silenceID
          type: string
          format: uuid
          required: true
          description: ID of the silence to get
      responses:
        '200':
          description: Delete silence response
        '404':
          description: A silence with the specified ID was not found
        '500':
          $ref: '#/responses/InternalServerError'
  /oscar/actions:
    post:
      tags: [alert]
      operationId: executeOscarAction
      description: Admit one exact native episode operation. Requires an exact-body Middleware action assertion.
      parameters:
        - $ref: '#/parameters/oscarActionSender'
        - $ref: '#/parameters/oscarActionKeyId'
        - $ref: '#/parameters/oscarActionTime'
        - $ref: '#/parameters/oscarActionSubject'
        - $ref: '#/parameters/oscarActionGrant'
        - $ref: '#/parameters/oscarActionSignature'
        - name: X-Oscar-Action-Recovery
          in: header
          type: string
          description: Signed recovery directive required only for a freshly fenced policy recovery submission.
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/oscarActionRequest'
      responses:
        '200':
          description: Current operation or eligibility projection
          schema:
            $ref: '#/definitions/oscarActionResult'
        '202':
          description: Durably accepted
          schema: {$ref: '#/definitions/oscarActionResult'}
        '400': {description: Invalid request}
        '401': {description: Invalid action assertion}
        '403': {description: Action permission denied}
        '404': {description: Unknown operation}
        '409':
          description: A held or rejected operation receipt, or a reason-only lifecycle conflict.
          schema: {$ref: '#/definitions/oscarActionConflict'}
        '413': {description: Request too large}
        '503': {description: Native authority unavailable}
  /oscar/actions/eligibility:
    post:
      tags: [alert]
      operationId: getOscarActionEligibility
      description: Evaluate current eligibility without issuing a permit. Requires an exact-body Middleware action assertion.
      parameters:
        - $ref: '#/parameters/oscarActionSender'
        - $ref: '#/parameters/oscarActionKeyId'
        - $ref: '#/parameters/oscarActionTime'
        - $ref: '#/parameters/oscarActionSubject'
        - $ref: '#/parameters/oscarActionGrant'
        - $ref: '#/parameters/oscarActionSignature'
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/oscarActionBatch'
      responses:
        '200':
          description: Current operation or eligibility projection
          schema:
            type: array
            items: {$ref: '#/definitions/oscarActionEligibility'}
        '400': {description: Invalid request}
        '401': {description: Invalid action assertion}
        '403': {description: Action permission denied}
        '404': {description: Unknown operation}
        '409': {description: Native lifecycle or operation conflict}
        '413': {description: Request too large}
        '503': {description: Native authority unavailable}
  /oscar/actions/{operation_id}:
    get:
      tags: [alert]
      operationId: getOscarAction
      description: Look up a durable operation receipt. Requires an exact-body Middleware action assertion.
      parameters:
        - $ref: '#/parameters/oscarActionSender'
        - $ref: '#/parameters/oscarActionKeyId'
        - $ref: '#/parameters/oscarActionTime'
        - $ref: '#/parameters/oscarActionSubject'
        - $ref: '#/parameters/oscarActionGrant'
        - $ref: '#/parameters/oscarActionSignature'
        - {name: operation_id, in: path, type: string, format: uuid, required: true}
      responses:
        '200':
          description: Current operation or eligibility projection
          schema:
            $ref: '#/definitions/oscarActionResult'
        '400': {description: Invalid request}
        '401': {description: Invalid action assertion}
        '403': {description: Action permission denied}
        '404': {description: Unknown operation}
        '409': {description: Native lifecycle or operation conflict}
        '413': {description: Request too large}
        '503': {description: Native authority unavailable}
  /oscar/alerts/scoped-page:
    post:
      tags: [alert]
      operationId: getOscarScopedAlertsPage
      description: Read a native page under an operator-signed authority. See docs/alerts_api.md for the HMAC transcript and limits.
      parameters:
        - {in: header, name: X-Oscar-Read-Sender, type: string, required: true, description: 'operator'}
        - {in: header, name: X-Oscar-Read-Key-Id, type: string, required: true, description: 'v1'}
        - {in: header, name: X-Oscar-Read-Time, type: string, required: true, description: 'Unix timestamp in seconds'}
        - {in: header, name: X-Oscar-Read-Subject, type: string, required: true, description: 'Unpadded base64url of the acting operator ID'}
        - {in: header, name: X-Oscar-Read-Grant, type: string, required: true, description: 'read:alerts'}
        - {in: header, name: X-Oscar-Read-Signature, type: string, required: true, description: 'Hex HMAC-SHA256 over the scoped read transcript'}
        - in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/oscarScopedPageRequest'
      responses:
        '200':
          description: Authorized native page with contract version 2
          headers:
            X-Oscar-Scoped-Page-Version: {type: string, description: Signed scope contract version 1}
          schema:
            $ref: '#/definitions/oscarAlertPage'
        '400':
          description: Invalid envelope, policy or paging parameters
        '401':
          description: Invalid read assertion or operator key unavailable
        '405':
          description: Method must be POST
        '413':
          description: Body exceeds the read limit
        '500':
          $ref: '#/responses/InternalServerError'
        '503':
          description: Concurrent read limit reached
  /oscar/alerts/page:
    get:
      tags:
        - alert
      operationId: getOscarAlertsPage
      description: Get a page of native alerts
      parameters:
        - in: query
          name: page
          type: string
        - in: query
          name: perPage
          type: string
        - in: query
          name: column
          type: string
        - in: query
          name: order
          type: string
        - in: query
          name: active
          type: string
        - in: query
          name: silenced
          type: string
        - in: query
          name: inhibited
          type: string
        - in: query
          name: unprocessed
          type: string
        - in: query
          name: receiver
          type: string
        - in: query
          name: severity
          type: string
        - in: query
          name: quick_search
          type: string
        - in: query
          name: grid_filter
          type: string
        - in: query
          name: base_filter
          type: string
        - in: query
          name: filter
          type: array
          collectionFormat: multi
          items:
            type: string
        - $ref: "#/parameters/receiverMatchers"
      responses:
        "200":
          description: Paged alerts
          schema:
            $ref: "#/definitions/oscarAlertPage"
        "400":
          $ref: "#/responses/BadRequest"
        "500":
          $ref: "#/responses/InternalServerError"
  /alerts:
    get:
      tags:
        - alert
      operationId: getAlerts
      description: Get a list of alerts
      parameters:
        - in: query
          name: active
          type: boolean
          description: Include active alerts in results. If false, excludes active alerts and returns only suppressed (silenced or inhibited) alerts.
          default: true
        - in: query
          name: silenced
          type: boolean
          description: Include silenced alerts in results. If false, excludes silenced alerts. Note that true (default) shows both silenced and non-silenced alerts.
          default: true
        - in: query
          name: inhibited
          type: boolean
          description: Include inhibited alerts in results. If false, excludes inhibited alerts. Note that true (default) shows both inhibited and non-inhibited alerts.
          default: true
        - in: query
          name: unprocessed
          type: boolean
          description: Include unprocessed alerts in results. If false, excludes unprocessed alerts. Note that true (default) shows both processed and unprocessed alerts.
          default: true
        - name: filter
          in: query
          description: A matcher expression to filter alerts. For example `alertname="MyAlert"`. It can be repeated to apply multiple matchers.
          required: false
          type: array
          collectionFormat: multi
          items:
            type: string
        - name: receiver
          in: query
          description: A regex matching receivers to filter alerts by
          required: false
          type: string
        - $ref: '#/parameters/receiverMatchers'
      responses:
        '200':
          description: Get alerts response
          schema:
            '$ref': '#/definitions/gettableAlerts'
        '400':
          $ref: '#/responses/BadRequest'
        '500':
          $ref: '#/responses/InternalServerError'
    post:
      tags:
        - alert
      operationId: postAlerts
      description: Create new Alerts
      parameters:
        - in: body
          name: alerts
          description: The alerts to create
          required: true
          schema:
            $ref: '#/definitions/postableAlerts'
      responses:
        '200':
          description: Create alerts response
        '500':
          $ref: '#/responses/InternalServerError'
        '400':
          $ref: '#/responses/BadRequest'
  /alerts/groups:
    get:
      tags:
        - alertgroup
      operationId: getAlertGroups
      description: Get a list of alert groups
      parameters:
        - in: query
          name: active
          type: boolean
          description: Include active alerts within the returned groups. If false, excludes active alerts from groups and only shows suppressed (silenced or inhibited) alerts.
          default: true
        - in: query
          name: silenced
          type: boolean
          description: Include silenced alerts within the returned groups. If false, excludes silenced alerts from groups. Note that true (default) shows both silenced and non-silenced alerts.
          default: true
        - in: query
          name: inhibited
          type: boolean
          description: Include inhibited alerts within the returned groups. If false, excludes inhibited alerts from groups. Note that true (default) shows both inhibited and non-inhibited alerts.
          default: true
        - in: query
          name: muted
          type: boolean
          description: Include muted (silenced or inhibited) alert groups in results. If false, excludes entire groups where all alerts are muted.
          default: true
        - name: filter
          in: query
          description: A matcher expression to filter alert groups. For example `alertname="MyAlert"`. It can be repeated to apply multiple matchers.
          required: false
          type: array
          collectionFormat: multi
          items:
            type: string
        - name: receiver
          in: query
          description: A regex matching receivers to filter alerts by
          required: false
          type: string
        - '$ref': '#/parameters/receiverMatchers'
      responses:
        '200':
          description: Get alert groups response
          schema:
            '$ref': '#/definitions/alertGroups'
        '400':
          $ref: '#/responses/BadRequest'
        '500':
          $ref: '#/responses/InternalServerError'

responses:
  BadRequest:
    description: Bad request
    schema:
      type: string
  InternalServerError:
    description: Internal server error
    schema:
      type: string

parameters:
  oscarActionSender:
    name: X-Oscar-Action-Sender
    in: header
    type: string
    required: true
  oscarActionKeyId:
    name: X-Oscar-Action-Key-Id
    in: header
    type: string
    required: true
  oscarActionTime:
    name: X-Oscar-Action-Time
    in: header
    type: string
    required: true
  oscarActionSubject:
    name: X-Oscar-Action-Subject
    in: header
    type: string
    required: true
  oscarActionGrant:
    name: X-Oscar-Action-Grant
    in: header
    type: string
    required: true
  oscarActionSignature:
    name: X-Oscar-Action-Signature
    in: header
    type: string
    required: true
  receiverMatchers:
    name: receiver_matchers
    in: query
    description: A matcher expression to filter by receiver labels. For example `owner="my-team"`. Can be repeated to apply multiple matchers.
    required: false
    type: array
    collectionFormat: multi
    items:
      type: string

definitions:
  oscarScopedPageRequest:
    type: object
    additionalProperties: false
    required: [version, scope, query]
    properties:
      version: {type: integer, enum: [1]}
      query:
        type: object
        description: Existing OSCAR GET page parameters, each represented as an array of strings.
        additionalProperties:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string}
      scope:
        type: object
        additionalProperties: false
        required: [unrestricted, allow, deny]
        properties:
          unrestricted: {type: boolean}
          allow:
            type: array
            maxItems: 32
            items: {$ref: '#/definitions/oscarPageScopeGroup'}
          deny:
            type: array
            maxItems: 32
            items: {$ref: '#/definitions/oscarPageScopeGroup'}
  oscarPageScopeGroup:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      logicOperator: {type: string, enum: [and, or]}
      items:
        type: array
        minItems: 1
        maxItems: 100
        items:
          type: object
          additionalProperties: false
          required: [field, operator, value]
          properties:
            field: {type: string, pattern: '^label:.+'}
            operator: {type: string, enum: [equals, isAnyOf]}
            value:
              description: A string for equals or an array of 1 through 100 strings for isAnyOf.
  oscarEpisodeRef:
    x-elm-natural-fields: true
    type: object
    additionalProperties: false
    required: [authority_id, episode_id, generation, variant_revision]
    properties:
      authority_id: {type: string, format: uuid}
      episode_id: {type: string, format: uuid}
      generation: {type: integer, format: uint64, x-elm-integer: Positive, minimum: 1}
      variant_revision: {type: integer, format: uint64, x-elm-integer: Positive, minimum: 1}
  oscarActionScope:
    type: object
    additionalProperties: false
    required: [receiver_id, notifier_id, action]
    properties:
      receiver_id: {type: string, minLength: 1}
      notifier_id: {type: string, format: uuid, x-nullable: true}
      action: {type: string, enum: [notification, ticket], x-nullable: true}
  oscarActionActor:
    type: object
    additionalProperties: false
    required: [kind, id]
    properties:
      kind: {type: string, enum: [operator, policy]}
      id: {type: string, minLength: 1, maxLength: 255}
  oscarPolicyBinding:
    x-elm-nullable-record: true
    x-elm-natural-fields: true
    type: object
    x-nullable: true
    additionalProperties: false
    required: [binding_id, revision_id, cancellation_generation]
    properties:
      binding_id: {type: string, format: uuid}
      revision_id: {type: string, format: uuid}
      cancellation_generation: {type: integer, format: uint64, x-elm-integer: Natural, minimum: 0}
  oscarActionRequest:
    type: object
    additionalProperties: false
    required: [version, operation_id, episode_ref, kind, target_scope, actor, policy_binding, target_severity]
    properties:
      version: {type: integer, enum: [1]}
      operation_id: {type: string, format: uuid}
      episode_ref: {$ref: '#/definitions/oscarEpisodeRef'}
      kind: {type: string, enum: [resend, escalate, acknowledge, ticket_create, ticket_associate]}
      target_scope: {type: array, maxItems: 100, items: {$ref: '#/definitions/oscarActionScope'}}
      actor: {$ref: '#/definitions/oscarActionActor'}
      policy_binding: {$ref: '#/definitions/oscarPolicyBinding'}
      target_severity: {type: string, enum: [info, minor, warning, major, critical], x-nullable: true}
  oscarDispatchTarget:
    x-elm-natural-fields: true
    type: object
    required: [receiver_id, integration_digest, scope, repeat_interval_us]
    properties:
      receiver_id: {type: string}
      integration_digest: {type: string}
      scope: {type: array, items: {$ref: '#/definitions/oscarActionScope'}}
      repeat_interval_us: {type: integer, format: int64, x-elm-integer: Positive, minimum: 1}
  oscarActionTargetResult:
    type: object
    required: [target_key, target, state, evidence, successor_id]
    properties:
      target_key: {type: string}
      target: {$ref: '#/definitions/oscarDispatchTarget'}
      state: {type: string, enum: [pending, confirmed, unknown, no_effect]}
      evidence: {type: string, x-nullable: true}
      successor_id: {type: string, format: uuid, x-nullable: true}
  oscarActionResult:
    x-elm-natural-fields: true
    type: object
    required: [operation_id, state, reason, episode_ref, severity_revision, floor_applied, permit_expires_at, targets]
    properties: &oscarActionReceiptProperties
      operation_id: {type: string, format: uuid}
      state: {type: string, enum: [accepted, held, rejected, confirmed, partial, unknown, superseded_no_effect]}
      reason: {type: string, x-nullable: true}
      episode_ref: {$ref: '#/definitions/oscarEpisodeRef'}
      severity_revision: {type: integer, format: uint64, x-elm-integer: Natural, minimum: 0}
      floor_applied: {type: string, x-nullable: true}
      permit_expires_at:
        type: string
        format: date-time
        description: Exact permit expiry for the next recovery's previous_permit_expires_at.
        x-nullable: true
        x-go-type:
          type: Time
          import: {package: time}
          hints: {kind: object, noValidation: true}
        x-elm-exact-date-time: true
      targets: {type: array, items: {$ref: '#/definitions/oscarActionTargetResult'}}
  oscarActionConflict:
    x-elm-natural-fields: true
    type: object
    description: A durable conflict receipt includes its operation ID and projection. A pre-admission conflict contains only the reason.
    required: [reason]
    properties: *oscarActionReceiptProperties
  oscarActionBatch:
    type: object
    additionalProperties: false
    required: [refs]
    properties:
      refs: {type: array, maxItems: 100, items: {$ref: '#/definitions/oscarEpisodeRef'}}
  oscarActionEligibility:
    x-elm-natural-fields: true
    type: object
    required: [episode_ref, actions, severity_revision]
    properties:
      episode_ref: {$ref: '#/definitions/oscarEpisodeRef'}
      severity_revision: {type: integer, format: uint64, x-elm-integer: Natural, minimum: 0, x-nullable: true}
      actions:
        type: object
        additionalProperties:
          type: object
          required: [allowed, reason]
          properties:
            allowed: {type: boolean}
            reason: {type: string, x-nullable: true}
  alertmanagerStatus:
    type: object
    properties:
      cluster:
        $ref: '#/definitions/clusterStatus'
      versionInfo:
        $ref: '#/definitions/versionInfo'
      config:
        $ref: '#/definitions/alertmanagerConfig'
      uptime:
        type: string
        format: date-time
    required:
      - cluster
      - versionInfo
      - config
      - uptime
  clusterStatus:
    type: object
    properties:
      name:
        type: string
      status:
        type: string
        enum: ["ready", "settling", "disabled"]
      peers:
        type: array
        items:
          $ref: '#/definitions/peerStatus'
    required:
      - status
  alertmanagerConfig:
    type: object
    properties:
      original:
        type: string
    required:
      - original
  versionInfo:
    type: object
    properties:
      version:
        type: string
      revision:
        type: string
      branch:
        type: string
      buildUser:
        type: string
      buildDate:
        type: string
      goVersion:
        type: string
    required:
      - version
      - revision
      - branch
      - buildUser
      - buildDate
      - goVersion
  peerStatus:
    type: object
    properties:
      name:
        type: string
      address:
        type: string
    required:
      - name
      - address
  silence:
    type: object
    properties:
      matchers:
        $ref: '#/definitions/matchers'
      startsAt:
        type: string
        format: date-time
      endsAt:
        type: string
        format: date-time
      createdBy:
        type: string
      comment:
        type: string
      annotations:
        $ref: "#/definitions/labelSet"
    required:
      - matchers
      - startsAt
      - endsAt
      - createdBy
      - comment
  gettableSilence:
    allOf:
      - type: object
        properties:
          id:
            type: string
          status:
            $ref: '#/definitions/silenceStatus'
          updatedAt:
            type: string
            format: date-time
        required:
          - id
          - status
          - updatedAt
          - annotations
      - $ref: '#/definitions/silence'
  postableSilence:
    allOf:
      - type: object
        properties:
          id:
            type: string
      - $ref: '#/definitions/silence'
  silenceStatus:
    type: object
    properties:
      state:
        type: string
        enum: ["expired", "active", "pending"]
    required:
      - state
  gettableSilences:
    type: array
    items:
      $ref: '#/definitions/gettableSilence'
  matchers:
    type: array
    items:
      $ref: '#/definitions/matcher'
    minItems: 1
  matcher:
    type: object
    properties:
      name:
        type: string
      value:
        type: string
      isRegex:
        type: boolean
      isEqual:
        type: boolean
        default: true
    required:
      - name
      - value
      - isRegex
  alert:
    type: object
    properties:
      labels:
        $ref: '#/definitions/labelSet'
      generatorURL:
        type: string
        format: uri
    required:
      - labels
  oscarAlertPage:
    type: object
    properties:
      contract_version:
        type: integer
        format: int64
      records:
        $ref: '#/definitions/gettableAlerts'
      total_records:
        type: integer
        format: int64
      total_pages:
        type: integer
        format: int64
      timing_by_fingerprint:
        type: object
        additionalProperties:
          $ref: '#/definitions/oscarAlertTiming'
      source_severity_by_fingerprint:
        type: object
        description: Source severity from the same sampled alert, present when it differs from the effective severity.
        additionalProperties:
          type: string
    required:
      - contract_version
      - records
      - total_records
      - total_pages
      - timing_by_fingerprint
  oscarAlertTiming:
    type: object
    properties:
      end_time_source:
        type: string
        enum: [unknown, sender_ends_at, alertmanager_timeout]
      resolve_timeout_duration:
        type: string
        x-nullable: true
      timing_as_of:
        type: string
        format: date-time
      repeat_lookup_state:
        type: string
        enum: [ready, unavailable]
      repeat_schedules:
        type: array
        items:
          $ref: '#/definitions/oscarRepeatSchedule'
      muted_by:
        type: array
        description: Names of time intervals muting at least one matched route; alert status remains the global silence/inhibition status.
        items:
          type: string
    required:
      - end_time_source
      - timing_as_of
      - repeat_lookup_state
      - repeat_schedules
  oscarRepeatSchedule:
    type: object
    properties:
      route_id:
        type: string
      receiver:
        type: string
      integration:
        type: string
      repeat_interval_duration:
        type: string
      next_repeat_eligible_at:
        type: string
        format: date-time
        x-nullable: true
      state:
        type: string
        enum: [estimated, no_repeat_baseline, suppressed, unavailable]
    required:
      - route_id
      - receiver
      - integration
      - repeat_interval_duration
      - state
  gettableAlerts:
    type: array
    items:
      $ref: '#/definitions/gettableAlert'
  gettableAlert:
    allOf:
      - type: object
        properties:
          annotations:
            $ref: '#/definitions/labelSet'
          receivers:
            type: array
            items:
              $ref: '#/definitions/receiverReference'
          fingerprint:
            type: string
          startsAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
          endsAt:
            type: string
            format: date-time
          status:
            $ref: '#/definitions/alertStatus'
        required:
          - receivers
          - fingerprint
          - startsAt
          - updatedAt
          - endsAt
          - annotations
          - status
      - $ref: '#/definitions/alert'
  postableAlerts:
    type: array
    items:
      $ref: '#/definitions/postableAlert'
  postableAlert:
    allOf:
      - type: object
        properties:
          startsAt:
            type: string
            format: date-time
          endsAt:
            type: string
            format: date-time
          annotations:
            $ref: '#/definitions/labelSet'
      - $ref: '#/definitions/alert'
  alertGroups:
    type: array
    items:
      $ref: '#/definitions/alertGroup'
  alertGroup:
    type: object
    properties:
      labels:
        $ref: '#/definitions/labelSet'
      routeLabels:
        $ref: '#/definitions/labelSet'
      receiver:
        $ref: '#/definitions/receiverReference'
      alerts:
        type: array
        items:
          $ref: '#/definitions/gettableAlert'
    required:
      - labels
      - routeLabels
      - receiver
      - alerts
  alertStatus:
    type: object
    properties:
      state:
        type: string
        enum: ['unprocessed', 'active', 'suppressed']
      silencedBy:
        type: array
        items:
          type: string
      inhibitedBy:
        type: array
        items:
          type: string
      mutedBy:
        type: array
        items:
          type: string
    required:
      - state
      - silencedBy
      - inhibitedBy
      - mutedBy
  receiver:
    type: object
    properties:
      name:
        type: string
      labels:
        $ref: '#/definitions/labelSet'
    required:
      - name
  receiverReference:
    type: object
    properties:
      name:
        type: string
    required:
      - name
  labelSet:
    type: object
    additionalProperties:
      type: string


tags:
  - name: general
    description: General Alertmanager operations
  - name: receiver
    description: Everything related to Alertmanager receivers
  - name: silence
    description: Everything related to Alertmanager silences
  - name: alert
    description: Everything related to Alertmanager alerts
